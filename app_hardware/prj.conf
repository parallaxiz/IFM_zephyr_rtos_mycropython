# Hardware Abstraction Layer (HAL) Requirements
CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y

# System and Console Configurations
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_POLL=y

# Watchdog: auto-resets board if a script runs forever (infinite loop)
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n
