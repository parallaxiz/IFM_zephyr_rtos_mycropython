tests:
  micropython.hardware.hal_and_runner:
    tags:
      - micropython
      - hardware
      - nrf5340
      - native_sim
    platform_allow:
      - native_sim
      - nrf5340dk/nrf5340/cpuapp
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "HARDWARE BOOT"
        - "HAL Self-Test Starting"
        - "HAL Self-Test Complete"
        - "MicroPython initialized successfully"
        - "Entering script receive loop"
